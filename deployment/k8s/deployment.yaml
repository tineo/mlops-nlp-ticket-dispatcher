apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-classifier-deploy
  labels:
    app: ticket-classifier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-classifier
  template:
    metadata:
      labels:
        app: ticket-classifier
    spec:
      containers:
      - name: ticket-classifier
        # Imagen docker hospedada en Azure Container Registry (ACR)
        image: tuempresa.azurecr.io/ticket-classifier:v1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: MODEL_PATH
          value: "/app/model"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
