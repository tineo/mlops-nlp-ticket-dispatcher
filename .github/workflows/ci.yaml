name: CI Pipeline - NLP Preprocessing

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest nltk pandas scikit-learn mlflow
          
      - name: Download NLTK Data
        run: |
          python -c "import nltk; nltk.download('stopwords')"

      - name: Run Pytest
        run: |
          export PYTHONPATH=.
          pytest tests/
